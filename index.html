<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Chicago Sports Ticker</title>
  <style>
    :root {
      --bg: #191919;
      --panel: #222;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --line: #383838;
      --bulls: #ce1141;
      --cubs: #0e3386;
      --hawks: #cf0a2c;
      --bears: #c83803;
      --speed: 42s; /* Fallback; JavaScript calculates the actual duration */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .ticker-shell {
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .ticker-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #202020;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      letter-spacing: .09em;
      font-size: 12px;
    }
    .brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef444477;
    }
    .league-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: #1d1d1d;
      border-bottom: 1px solid var(--line);
    }
    .tab-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-color: #444;
      background: #292929;
      white-space: nowrap;
    }
    .tab-button.active {
      background: #3b2026;
      border-color: #ce1141;
      box-shadow: inset 0 -2px 0 #ce1141;
    }
    .tab-button .brand-mark { flex: 0 0 8px; }
    .league-game-card .team-logo { flex-basis: 38px; width: 38px; height: 38px; }
    .league-game-card .team-logo img { width: 36px; height: 36px; }
    .league-game-card .matchup { font-size: 13px; }
    .league-game-card .score { font-size: 18px; }
    .empty-league-card { min-width: 300px; }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }
    button {
      color: var(--text);
      background: #303030;
      border: 1px solid #494949;
      border-radius: 7px;
      padding: 6px 9px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #3a3a3a; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .ticker-viewport { overflow: hidden; position: relative; }
    .ticker-track {
      display: flex;
      width: max-content;
      animation: scroll var(--speed) linear infinite;
      will-change: transform;
    }
    .ticker-viewport:hover .ticker-track,
    .ticker-viewport:focus-within .ticker-track { animation-play-state: paused; }
    .ticker-group { display: flex; flex: none; }
    .game-card {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 290px;
      max-width: 420px;
      padding: 14px 18px;
      border-right: 1px solid var(--line);
    }
    .team-logo {
      display: grid;
      place-items: center;
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      overflow: hidden;
      border-radius: 10px;
      background: transparent;
    }
    .team-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .team-logo.bulls img { width: 44px; height: 44px; }
    .team-logo.cubs img { width: 44px; height: 44px; }
    .team-logo.hawks img { width: 46px; height: 38px; }
    .team-logo.bears img { width: 46px; height: 38px; }
    .game-main { min-width: 0; flex: 1; }
    .team-name {
      font-size: 11px;
      gap: 9px;
      color: var(--muted);
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 3px;
      white-space: nowrap;
    }
    .matchup {
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
      min-width: 0;
      max-width: 100%;
      line-height: 1.3;
    }
    .detail {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
    }
    .score {
      min-width: 48px;
      text-align: right;
      font-size: 21px;
      line-height: 1;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .score small {
      display: block;
      font-size: 10px;
      font-weight: 700;
      margin-top: 6px;
      color: var(--muted);
    }
    .ticker-bottom {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }
    .status-live { color: #ff7777 !important; }
    .status-final { color: #d6d6d6 !important; }
    .status-upcoming { color: #9cc2ff !important; }
    .status-error { color: #ffc078 !important; }
    .ticker-shell.static .ticker-track { animation: none; width: 100%; }
    .ticker-shell.static #tickerClone { display: none; }
    .ticker-shell.static .ticker-group { flex-wrap: wrap; width: 100%; }
    .ticker-shell.static .game-card { flex: 1 1 320px; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    @media (max-width: 520px) {
      .ticker-top { padding: 9px 10px; }
      .league-tabs { padding: 7px 8px; }
      .tab-button { padding: 6px 8px; font-size: 11px; }
      .controls .updated { display: none; }
      .game-card { min-width: 270px; padding: 12px; }
      .ticker-bottom { padding: 7px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
    }
  </style>
</head>
<body>
  <main class="ticker-shell" id="tickerShell" aria-label="Chicago sports scores">
    <header class="ticker-top">
      <div class="brand">CHICAGO SPORTS TICKER</div>
      <div class="controls">
        <span class="updated" id="updated">Loading scores…</span>
        <button id="layoutButton" type="button" aria-pressed="false" title="Switch between scrolling ticker and static cards">Static view</button>
        <button id="refreshButton" type="button">↻ Refresh</button>
      </div>
    </header>
    <nav class="league-tabs" aria-label="Ticker views">
      <button class="tab-button active" id="chicagoTab" type="button" aria-pressed="true"><span class="brand-mark" aria-hidden="true"></span> Chicago Sports</button>
      <button class="tab-button" id="mlbTab" type="button" aria-pressed="false">MLB</button>
      <button class="tab-button" id="nbaTab" type="button" aria-pressed="false">NBA</button>
      <button class="tab-button" id="nhlTab" type="button" aria-pressed="false">NHL</button>
      <button class="tab-button" id="nflTab" type="button" aria-pressed="false">NFL</button>
    </nav>
    <section class="ticker-viewport" aria-live="polite" aria-label="Team scores">
      <div class="ticker-track" id="tickerTrack">
        <div class="ticker-group" id="tickerPrimary">
          <article class="game-card"><div class="team-logo bulls"><img src="https://a.espncdn.com/i/teamlogos/nba/500/chi.png" alt="Chicago Bulls logo"></div><div class="game-main"><div class="team-name">CHICAGO BULLS · NBA</div><div class="matchup">Loading scoreboard…</div><div class="detail">Connecting to score data</div></div></article>
        </div>
        <div class="ticker-group" id="tickerClone" aria-hidden="true"></div>
      </div>
    </section>
    <footer class="ticker-bottom">
      <span id="sourceStatus">Scores provided by ESPN data feeds</span>
      <span>Auto-refresh: 60 sec</span>
    </footer>
  </main>

  <script>
    // ESPN's publicly reachable scoreboard feeds are undocumented and may change.
    // No API key is required for the current implementation.
    const TEAMS = [
      {
        key: "bulls", name: "CHICAGO BULLS", league: "NBA", abbreviation: "CHI",
        path: "basketball/nba", className: "bulls", code: "CHI",
        logo: "https://a.espncdn.com/i/teamlogos/nba/500/chi.png"
      },
      {
        key: "cubs", name: "CHICAGO CUBS", league: "MLB", abbreviation: "CHC",
        path: "baseball/mlb", className: "cubs", code: "CHC",
        logo: "https://a.espncdn.com/i/teamlogos/mlb/500/chc.png"
      },
      {
        key: "hawks", name: "CHICAGO BLACKHAWKS", league: "NHL", abbreviation: "CHI",
        path: "hockey/nhl", className: "hawks", code: "CHI",
        logo: "https://a.espncdn.com/i/teamlogos/nhl/500/chi.png"
      },
      {
        key:"bears", name: "CHICAGO BEARS", league: "NFL", abbreviation: "CHI",
        path: "football/nfl", className: "bears", code: "CHI",
        logo: "https://a.espncdn.com/i/teamlogos/nfl/500/chi.png"
      }
    ];
    const API_ROOT = "https://site.api.espn.com/apis/site/v2/sports/";
    const REFRESH_MS = 60_000;
    // Consistent scrolling speed across all tabs.
    // Higher number = faster scrolling.
    const TICKER_SPEED = 50; // pixels per second

    function updateTickerSpeed() {
      if (staticView) return;

      const contentWidth = primary.scrollWidth;

      if (!contentWidth) return;

      const duration = contentWidth / TICKER_SPEED;

      tickerShell.style.setProperty(
        "--speed",
        `${duration}s`
      );
    }
    const tickerShell = document.getElementById("tickerShell");
    const primary = document.getElementById("tickerPrimary");
    const clone = document.getElementById("tickerClone");
    const updated = document.getElementById("updated");
    const sourceStatus = document.getElementById("sourceStatus");
    const refreshButton = document.getElementById("refreshButton");
    const layoutButton = document.getElementById("layoutButton");
    const chicagoTab = document.getElementById("chicagoTab");
    const mlbTab = document.getElementById("mlbTab");
    const nbaTab = document.getElementById("nbaTab");
    const nhlTab = document.getElementById("nhlTab");
    const nflTab = document.getElementById("nflTab");
    const leagueTabs = { chicago: chicagoTab, mlb: mlbTab, nba: nbaTab, nhl: nhlTab, nfl: nflTab };
    const LEAGUES = {
      mlb: { label: "MLB", path: "baseball/mlb", sport: "baseball" },
      nba: { label: "NBA", path: "basketball/nba", sport: "basketball" },
      nhl: { label: "NHL", path: "hockey/nhl", sport: "hockey" },
      nfl: { label: "NFL", path: "football/nfl", sport: "football" }
    };
    let activeView = "chicago";
    let staticView = false;
    let refreshTimer = null;
    let lastGoodCards = null;

    const dateKey = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}${m}${d}`;
    };
    const addDays = (date, count) => {
      const result = new Date(date);
      result.setDate(result.getDate() + count);
      return result;
    };
    const escapeText = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
    const localTime = (dateString) => {
      const d = new Date(dateString);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    };

    async function fetchScoreboard(team) {
      // Scoreboard requests use one date only; ESPN may reject date ranges.
      const today = dateKey(new Date());
      const url = `${API_ROOT}${team.path}/scoreboard?dates=${today}`;
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`${team.league} scoreboard returned HTTP ${response.status}`);
      return response.json();
    }

    async function fetchTeamSchedule(team) {
      // The team schedule provides upcoming games and recent results.
      const teamCode = team.abbreviation.toLowerCase();
      const url = `${API_ROOT}${team.path}/teams/${teamCode}/schedule`;
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`${team.league} schedule returned HTTP ${response.status}`);
      return response.json();
    }

    function seasonFallbackActive(team, date = new Date()) {
      // Used only if schedule data is unavailable or has no usable dates.
      const month = date.getMonth(); // January = 0
      if (team.league === "NBA") return month >= 9 || month <= 5; // Oct–Jun
      if (team.league === "MLB") return month >= 2 && month <= 10; // Mar–Nov
      if (team.league === "NHL") return month >= 8 || month <= 5; // Sep–Jun
      if (team.league === "NFL") return month >= 7 || month <= 2; // Aug-Feb
      return true;
    }

    function isSeasonActive(team, events, now = Date.now()) {
      const datedEvents = (events || [])
        .map(event => new Date(event.date || event.competitions?.[0]?.date || NaN).getTime())
        .filter(time => Number.isFinite(time));

      if (!datedEvents.length) return seasonFallbackActive(team);

      // Treat a team as in-season when its schedule has a game within the
      // recent 21-day / upcoming 45-day window. This avoids showing teams
      // throughout the long gap between seasons when the next schedule is published.
      const recentWindow = 21 * 24 * 60 * 60 * 1000;
      const futureWindow = 45 * 24 * 60 * 60 * 1000;
      return datedEvents.some(time => time >= now - recentWindow && time <= now + futureWindow);
    }

    function parseTeamEvent(team, event) {
      const competition = event.competitions?.[0];
      const competitors = competition?.competitors || [];
      const ours = competitors.find(c => c.team?.abbreviation?.toUpperCase() === team.abbreviation);
      if (!ours) return null;
      const opponent = competitors.find(c => c !== ours);
      if (!opponent) return null;

      const status = event.status || competition.status || {};
      const type = status.type || {};
      const state = String(type.state || "").toLowerCase();
      const completed = state === "post" || type.completed === true;
      const inProgress = state === "in";
      const opponentName = opponent.team?.shortDisplayName || opponent.team?.displayName || opponent.team?.name || "Opponent";
      const prefix = ours.homeAway === "home" ? "vs" : "@";
      const oursScore = ours.score?.displayValue ?? ours.score ?? "";
      const opponentScore = opponent.score?.displayValue ?? opponent.score ?? "";
      const date = event.date || competition.date;
      let detail = type.shortDetail || type.detail || type.description || "";
      if (inProgress) detail = `LIVE · ${detail || "In progress"}`;
      else if (completed) detail = `FINAL${type.shortDetail ? ` · ${type.shortDetail}` : ""}`;
      else detail = localTime(date) || "Upcoming game";

      let scoreText = "—";
      if (oursScore !== "" && opponentScore !== "") scoreText = `${oursScore}–${opponentScore}`;
      let statusClass = inProgress ? "status-live" : completed ? "status-final" : "status-upcoming";
      return {
        team, eventId: String(event.id || ""), date: date || "",
        time: new Date(date || 0).getTime(), completed, inProgress,
        matchup: `${prefix} ${opponentName}`, detail, scoreText, statusClass,
        oursScore: Number(ours.score?.value ?? ours.score),
        opponentScore: Number(opponent.score?.value ?? opponent.score)
      };
    }

    function chooseEvent(team, events) {
      const now = Date.now();
      const parsed = events.map(event => parseTeamEvent(team, event)).filter(Boolean);
      // Prefer a live game, then the nearest upcoming game, then the latest final.
      const live = parsed.find(game => game.inProgress);
      if (live) return live;
      const upcoming = parsed.filter(game => !game.completed && game.time >= now).sort((a, b) => a.time - b.time)[0];
      if (upcoming) return upcoming;
      const recentFinal = parsed.filter(game => game.completed).sort((a, b) => b.time - a.time)[0];
      if (recentFinal) return recentFinal;
      const future = parsed.filter(game => !game.completed).sort((a, b) => a.time - b.time)[0];
      return future || null;
    }

    function cardHTML(game, team) {
      const matchup = game ? game.matchup : "No game found";
      const detail = game ? game.detail : "No scheduled game in the feed";
      const score = game ? game.scoreText : "—";
      const statusClass = game ? game.statusClass : "";
      return `
        <article class="game-card">
          <div class="team-logo ${team.className}"><img src="${team.logo}" alt="${escapeText(team.name)} logo" loading="eager"></div>
          <div class="game-main">
            <div class="team-name">${escapeText(team.name)} · ${team.league}</div>
            <div class="matchup">${escapeText(matchup)}</div>
            <div class="detail ${statusClass}">${escapeText(detail)}</div>
          </div>
          <div class="score">${escapeText(score)}<small class="${statusClass}">${game?.inProgress ? "LIVE" : game?.completed ? "FINAL" : game ? "GAME" : ""}</small></div>
        </article>`;
    }

    function render(cards) {
      const visibleCards = cards
        .map((entry, i) => ({ entry, team: TEAMS[i] }))
        .filter(({ entry }) => !entry?.hidden);

      const hasActiveTeams = visibleCards.length > 0;
      let html = visibleCards
        .map(({ entry, team }) => cardHTML(entry?.game ?? entry ?? null, team))
        .join("");

      if (!hasActiveTeams) {
        html = `<article class="game-card off-season-card"><div class="game-main"><div class="team-name">CHICAGO SPORTS</div><div class="matchup">Off-season</div><div class="detail">No Chicago teams are currently in season.</div></div></article>`;
        sourceStatus.textContent = "Off-season · No active Chicago team seasons";
      }

      primary.innerHTML = html;
      // A duplicate group makes the marquee loop smoothly. The clone is hidden from screen readers.
      clone.innerHTML = hasActiveTeams ? html : "";
      requestAnimationFrame(updateTickerSpeed);
      tickerShell.classList.toggle("static", staticView);
      layoutButton.textContent = staticView ? "Scrolling view" : "Static view";
      layoutButton.setAttribute("aria-pressed", String(staticView));
      if (hasActiveTeams && !visibleCards.some(({ entry }) => entry && !entry.hidden && (entry.game ?? entry))) {
        sourceStatus.textContent = "No games returned by the feeds; try Refresh later.";
      }
    }

    async function refreshChicagoScores() {
      refreshButton.disabled = true;
      updated.textContent = "Updating…";
      sourceStatus.textContent = "Checking ESPN score feeds…";
      try {
        const results = await Promise.allSettled(TEAMS.map(async team => {
          const [scoreboardResult, scheduleResult] = await Promise.allSettled([
            fetchScoreboard(team),
            fetchTeamSchedule(team)
          ]);

          const scoreboardEvents = scoreboardResult.status === "fulfilled"
            ? (scoreboardResult.value.events || [])
            : [];
          const scheduleEvents = scheduleResult.status === "fulfilled"
            ? (scheduleResult.value.events || [])
            : [];
          const allEvents = [
            ...scheduleEvents,
            ...scoreboardEvents
          ];
          const uniqueEvents = [...new Map(
            allEvents.filter(event => event && event.id != null)
              .map(event => [String(event.id), event])
          ).values()];

          if (scoreboardResult.status === "rejected" && scheduleResult.status === "rejected") {
            throw new Error(`${team.name}: scoreboard and schedule both failed`);
          }

          const active = scheduleResult.status === "fulfilled"
            ? isSeasonActive(team, scheduleEvents)
            : seasonFallbackActive(team);

          if (!active) {
            return { hidden: true, game: null };
          }

          return { hidden: false, game: chooseEvent(team, uniqueEvents) };
        }));

        const cards = results.map((result, index) => {
          if (result.status !== "fulfilled") {
            console.warn(`Could not load ${TEAMS[index].name}`, result.reason);
            return lastGoodCards ? lastGoodCards[index] || null : null;
          }
          return result.value;
        });

        const failed = results.filter(result => result.status === "rejected").length;
        lastGoodCards = cards;
        render(cards);

        if (cards.every(card => card?.hidden) || cards.every(card => card == null)) {
          sourceStatus.textContent = cards.every(card => card?.hidden)
            ? "Off-season · No active Chicago team seasons"
            : "Could not connect. Check your internet connection or try Refresh.";
        } else if (failed) {
          sourceStatus.textContent = `${failed} feed(s) unavailable; remaining feeds updated.`;
        } else if (!cards.every(card => card?.hidden)) {
          sourceStatus.textContent = "Scores provided by ESPN data feeds · Not affiliated with ESPN or the leagues";
        }

        updated.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
      } catch (error) {
        console.error("Error refreshing scores:", error);
        updated.textContent = "Update failed";
        sourceStatus.textContent = `Unable to refresh scores: ${error.message}`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    function leagueGameCardHTML(event, league, displayLabel = "") {
      const competition = event.competitions?.[0];
      const competitors = competition?.competitors || [];
      const away = competitors.find(team => team.homeAway === "away") || competitors[0];
      const home = competitors.find(team => team.homeAway === "home") || competitors[1];
      if (!away || !home) return "";
      const statusType = event.status?.type || competition?.status?.type || {};
      const state = String(statusType.state || "").toLowerCase();
      const live = state === "in";
      const completed = state === "post" || statusType.completed === true;
      const awayName = away.team?.abbreviation || away.team?.shortDisplayName || away.team?.displayName || "Away";
      const homeName = home.team?.abbreviation || home.team?.shortDisplayName || home.team?.displayName || "Home";
      const awayScore = away.score?.displayValue ?? away.score ?? "—";
      const homeScore = home.score?.displayValue ?? home.score ?? "—";
      const fallbackLogo = `https://a.espncdn.com/i/teamlogos/${league.sport}/500/scoreboard.png`;
      const awayLogo = away.team?.logo || fallbackLogo;
      const homeLogo = home.team?.logo || fallbackLogo;
      const date = event.date || competition?.date;
      const detail = live ? `LIVE · ${statusType.shortDetail || statusType.detail || "In progress"}`
        : completed ? `FINAL${statusType.shortDetail ? ` · ${statusType.shortDetail}` : ""}`
        : (statusType.shortDetail || localTime(date) || "Upcoming game");
      const statusClass = live ? "status-live" : completed ? "status-final" : "status-upcoming";
      const score = (away.score != null && home.score != null) ? `${awayScore}–${homeScore}` : "—";
      return `<article class="game-card league-game-card">
        <div class="team-logo"><img src="${escapeText(awayLogo)}" alt="${escapeText(awayName)} logo" loading="lazy"></div>
        <div class="game-main">
          <div class="team-name">${escapeText(displayLabel || `${league.label} · ${event.name || league.label}`)}</div>
          <div class="matchup">${escapeText(awayName)} @ ${escapeText(homeName)}</div>
          <div class="detail ${statusClass}">${escapeText(detail)}</div>
        </div>
        <div class="team-logo"><img src="${escapeText(homeLogo)}" alt="${escapeText(homeName)} logo" loading="lazy"></div>
        <div class="score">${escapeText(score)}<small class="${statusClass}">${live ? "LIVE" : completed ? "FINAL" : "GAME"}</small></div>
      </article>`;
    }

    async function refreshLeagueScores(leagueKey) {
      const league = LEAGUES[leagueKey];
      if (!league) return;
      refreshButton.disabled = true;
      updated.textContent = `Updating ${league.label}…`;
      sourceStatus.textContent = `Checking ESPN ${league.label} scoreboard…`;
      try {
        const now = new Date();
        const today = dateKey(now);
        const response = await fetch(`${API_ROOT}${league.path}/scoreboard?dates=${today}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`${league.label} scoreboard returned HTTP ${response.status}`);
        const data = await response.json();
        const events = data.events || [];
        let html = events.map(event => leagueGameCardHTML(event, league)).filter(Boolean).join("");
        let statusMessage = `${league.label} · ${events.length} game(s) on today's scoreboard · ESPN data feed`;

        // ESPN date-range requests can return HTTP 400, so check previous dates individually.
        // NFL schedules are weekly: when today's scoreboard is empty, collect every completed
        // game from the previous 7 days. Other leagues show the most recent date with games.
        if (!html) {
          if (leagueKey === "nfl") {
            const previousWeekEvents = [];
            const seenEventIds = new Set();
            for (let daysBack = 1; daysBack <= 7; daysBack++) {
              const pastDate = addDays(now, -daysBack);
              const pastKey = dateKey(pastDate);
              try {
                const pastResponse = await fetch(`${API_ROOT}${league.path}/scoreboard?dates=${pastKey}`, { cache: "no-store" });
                if (!pastResponse.ok) continue;
                const pastData = await pastResponse.json();
                const completedEvents = (pastData.events || []).filter(event => {
                  const competition = event.competitions?.[0];
                  const status = event.status?.type || competition?.status?.type || {};
                  return String(status.state || "").toLowerCase() === "post" || status.completed === true;
                });
                for (const event of completedEvents) {
                  const id = event.id || `${event.name || "game"}-${pastKey}`;
                  if (!seenEventIds.has(id)) {
                    seenEventIds.add(id);
                    previousWeekEvents.push(event);
                  }
                }
              } catch (pastError) {
                console.warn(`Could not check previous NFL scoreboard for ${pastKey}:`, pastError);
              }
            }
            if (previousWeekEvents.length) {
              html = previousWeekEvents.map(event => leagueGameCardHTML(event, league, "NFL · PREVIOUS WEEK")).filter(Boolean).join("");
              if (html) statusMessage = `No NFL games today · Showing ${previousWeekEvents.length} completed game(s) from the previous 7 days · ESPN data feed`;
            }
          } else {
            for (let daysBack = 1; daysBack <= 14; daysBack++) {
              const pastDate = addDays(now, -daysBack);
              const pastKey = dateKey(pastDate);
              try {
                const pastResponse = await fetch(`${API_ROOT}${league.path}/scoreboard?dates=${pastKey}`, { cache: "no-store" });
                if (!pastResponse.ok) continue;
                const pastData = await pastResponse.json();
                const pastEvents = (pastData.events || []).filter(event => {
                  const competition = event.competitions?.[0];
                  const status = event.status?.type || competition?.status?.type || {};
                  return String(status.state || "").toLowerCase() === "post" || status.completed === true;
                });
                if (pastEvents.length) {
                  const playedDate = pastDate.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
                  html = pastEvents.map(event => leagueGameCardHTML(event, league, `${league.label} · LAST PLAYED · ${playedDate}`)).filter(Boolean).join("");
                  if (html) {
                    statusMessage = `No ${league.label} games today · Showing ${pastEvents.length} game(s) last played ${playedDate} · ESPN data feed`;
                    break;
                  }
                }
              } catch (pastError) {
                console.warn(`Could not check previous ${league.label} scoreboard for ${pastKey}:`, pastError);
              }
            }
          }
        }

        if (!html) {
          html = `<article class="game-card empty-league-card"><div class="game-main"><div class="team-name">${league.label} · ALL TEAMS</div><div class="matchup">No ${league.label} games scheduled today</div><div class="detail">No completed ${league.label} games found in the last 14 days.</div></div></article>`;
          sourceStatus.textContent = `No ${league.label} games today, and no completed games were found in the last 14 days.`;
        } else {
          sourceStatus.textContent = statusMessage;
        }
        primary.innerHTML = html;
        clone.innerHTML = html;
        requestAnimationFrame(updateTickerSpeed);
        tickerShell.classList.toggle("static", staticView);
        updated.textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
      } catch (error) {
        console.error(`Error refreshing ${league.label} scores:`, error);
        primary.innerHTML = `<article class="game-card empty-league-card"><div class="game-main"><div class="team-name">${league.label} · ALL TEAMS</div><div class="matchup">Unable to load ${league.label} scores</div><div class="detail">${escapeText(error.message)} · Try Refresh.</div></div></article>`;
        clone.innerHTML = primary.innerHTML;
        sourceStatus.textContent = `Unable to load the ESPN ${league.label} feed.`;
        updated.textContent = "Update failed";
      } finally {
        refreshButton.disabled = false;
      }
    }

    function refreshScores() {
      if (activeView === "chicago") return refreshChicagoScores();
      return refreshLeagueScores(activeView);
    }

    function setActiveView(view) {
      activeView = view;
      Object.entries(leagueTabs).forEach(([key, tab]) => {
        tab.classList.toggle("active", key === view);
        tab.setAttribute("aria-pressed", String(key === view));
      });
      const label = view === "chicago" ? "Chicago sports" : `${LEAGUES[view]?.label || view.toUpperCase()} league-wide`;
      tickerShell.setAttribute("aria-label", `${label} scores`);
      refreshScores();
    }

    Object.entries(leagueTabs).forEach(([key, tab]) => {
      tab.addEventListener("click", () => setActiveView(key));
    });
    refreshButton.addEventListener("click", refreshScores);
    layoutButton.addEventListener("click", () => {
      staticView = !staticView;
      tickerShell.classList.toggle("static", staticView);
      layoutButton.textContent = staticView ? "Scrolling view" : "Static view";
      layoutButton.setAttribute("aria-pressed", String(staticView));
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshScores();
    });
    window.addEventListener("resize", () => {
      requestAnimationFrame(updateTickerSpeed);
    });

    refreshScores();
    refreshTimer = setInterval(() => {
      if (document.visibilityState === "visible") refreshScores();
    }, REFRESH_MS);
  </script>
</body>
</html>
